/* só o texto do meio muda de tamanho; os campos vazios ficam como eram,

[data-timeline-column] > header > div > p:nth-child(2){
  font-size:22px !important;
  transform:translateY(16px);
}
[data-timeline-column] > header > div > p:nth-child(1),
[data-timeline-column] > header > div > p:nth-child(3){ font-size:11px !important; }

[data-timeline-column] > header{ min-height:67px; }
/* a carta fica SEMPRE na mesma altura: sem essa trava, a coluna tinha 24px
   de folga de rolagem e cada carta parava num lugar diferente */
[data-timeline-column]{ overflow-y:hidden !important; }
/* todas as cartas na mesma altura da primeira: 13px a menos de respiro em cima */

.glow-dot--right2 span{ opacity:0 !important; }
